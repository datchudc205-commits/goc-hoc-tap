<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f6fde">
  <title>Góc Học Tập</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app"><div class="center muted" style="padding:3rem">Đang tải…</div></div>
  <script>
    // Luôn tải các file JS cùng một phiên bản mới nhất (tránh trộn file cũ/mới sau khi cập nhật app)
    (function () {
      var v = Date.now(), imports = {};
      ['main', 'config', 'db', 'lib', 'ui', 'auth', 'teacher', 'student', 'mathgen', 'image'].forEach(function (f) {
        imports['./js/' + f + '.js'] = './js/' + f + '.js?v=' + v;
      });
      var s = document.createElement('script');
      s.type = 'importmap';
      s.textContent = JSON.stringify({ imports: imports });
      document.currentScript.after(s);
    })();
  </script>
  <script type="module">import './js/main.js';</script>
</body>
</html>
